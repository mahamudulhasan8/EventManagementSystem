<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard - Evently{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="text-gray-900 antialiased min-h-screen flex bg-gray-50 overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#1e1b4b] border-r border-[#312e81] h-screen flex flex-col hidden md:flex flex-shrink-0 text-white">
        <div class="h-16 flex items-center px-6 border-b border-[#312e81]">
            <a href="{% url 'home' %}" class="flex items-center gap-2">
                <div class="bg-indigo-500 rounded p-1">
                    <i data-lucide="ticket" class="h-5 w-5 text-white"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">Evently</span>
            </a>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="{% url 'dashboard_home' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if request.resolver_match.url_name == 'dashboard_home' %}bg-indigo-500/20 text-indigo-300 font-medium{% else %}text-gray-300 hover:bg-white/5 hover:text-white transition-colors{% endif %}">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                Dashboard
            </a>
            <a href="{% url 'dashboard_events' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if request.resolver_match.url_name == 'dashboard_events' %}bg-indigo-500/20 text-indigo-300 font-medium{% else %}text-gray-300 hover:bg-white/5 hover:text-white transition-colors{% endif %}">
                <i data-lucide="calendar" class="w-5 h-5"></i>
                Events
            </a>
            <a href="{% url 'dashboard_bookings' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if request.resolver_match.url_name == 'dashboard_bookings' %}bg-indigo-500/20 text-indigo-300 font-medium{% else %}text-gray-300 hover:bg-white/5 hover:text-white transition-colors{% endif %}">
                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                Financials
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-white/5 hover:text-white transition-colors">
                <i data-lucide="users" class="w-5 h-5"></i>
                Attendees
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-white/5 hover:text-white transition-colors">
                <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                Reports
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-white/5 hover:text-white transition-colors">
                <i data-lucide="settings" class="w-5 h-5"></i>
                Settings
            </a>
        </nav>
        
        <div class="p-4 border-t border-[#312e81]">
            <a href="{% url 'logout' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-red-500/10 hover:text-red-400 font-medium transition-colors">
                <i data-lucide="log-out" class="w-5 h-5"></i>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Topbar -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-gray-500 hover:text-gray-700">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="relative hidden sm:block">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search..." class="pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 w-64 transition-all">
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button class="text-gray-500 hover:text-gray-700 relative">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div class="h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-semibold cursor-pointer border border-blue-200">
                    {{ user.email|first|upper }}
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
        <main class="flex-1 overflow-y-auto p-6 md:p-8">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
      });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
