{% extends 'base.html' %}

{% block title %}Sign Up - Evently{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Decorative background elements -->
    <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-indigo-50 opacity-50 blur-3xl -z-10"></div>
    <div class="absolute bottom-0 left-20 w-72 h-72 rounded-full bg-purple-50 opacity-50 blur-3xl -z-10"></div>

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl shadow-indigo-500/10 border border-gray-100 p-8">
        <div class="text-center mb-8">
            <div class="bg-indigo-600 rounded p-2 inline-flex mb-4">
                <i data-lucide="ticket" class="h-8 w-8 text-white"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-900">Create an account</h2>
            <p class="mt-2 text-sm text-gray-500">
                Already have an account? 
                <a href="{% url 'login' %}" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Log in</a>
            </p>
        </div>
        
        <form class="space-y-6" action="#" method="POST">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700">First Name</label>
                    <div class="mt-1">
                        <input id="first_name" name="first_name" type="text" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors">
                    </div>
                </div>
                <div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700">Last Name</label>
                    <div class="mt-1">
                        <input id="last_name" name="last_name" type="text" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors">
                    </div>
                </div>
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                <div class="mt-1">
                    <input id="email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="mt-1">
                    <input id="password" name="password" type="password" autocomplete="new-password" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors">
                </div>
            </div>
            
            <div>
                <label for="role" class="block text-sm font-medium text-gray-700">I want to...</label>
                <div class="mt-1">
                    <select id="role" name="role" class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm bg-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors">
                        <option value="CUSTOMER">Attend Events</option>
                        <option value="ORGANIZER">Host Events (Organizer)</option>
                    </select>
                </div>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                    Create Account
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
