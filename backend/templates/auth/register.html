{% extends 'base.html' %}

{% block title %}Sign Up - Evently{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Decorative background elements -->
    <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-indigo-50 opacity-50 blur-3xl -z-10"></div>
    <div class="absolute bottom-0 left-20 w-72 h-72 rounded-full bg-purple-50 opacity-50 blur-3xl -z-10"></div>

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl shadow-indigo-500/10 border border-gray-100 p-8">
        <div class="text-center mb-8">
            <div class="bg-indigo-600 rounded p-2 inline-flex mb-4">
                <i data-lucide="ticket" class="h-8 w-8 text-white"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-900">Create an account</h2>
            <p class="mt-2 text-sm text-gray-500">
                Already have an account? 
                <a href="{% url 'login' %}" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Log in</a>
            </p>
        </div>

        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="p-3.5 text-sm rounded-xl flex items-start gap-2.5 {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% elif message.tags == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-200{% else %}bg-indigo-50 text-indigo-700 border border-indigo-200{% endif %}">
                        <i data-lucide="{% if message.tags == 'error' %}alert-circle{% elif message.tags == 'success' %}check-circle-2{% else %}info{% endif %}" class="w-4 h-4 mt-0.5 shrink-0"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        <form class="space-y-5" action="{% url 'register' %}" method="POST">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700">First Name</label>
                    <div class="mt-1">
                        <input id="first_name" name="first_name" type="text" value="{{ first_name|default:'' }}" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" placeholder="John">
                    </div>
                </div>
                <div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700">Last Name</label>
                    <div class="mt-1">
                        <input id="last_name" name="last_name" type="text" value="{{ last_name|default:'' }}" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" placeholder="Doe">
                    </div>
                </div>
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                <div class="mt-1">
                    <input id="email" name="email" type="email" value="{{ email|default:'' }}" autocomplete="email" required class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" placeholder="john.doe@example.com">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="mt-1">
                    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6" class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" placeholder="At least 6 characters">
                </div>
            </div>
            
            <div>
                <label for="role" class="block text-sm font-medium text-gray-700">I want to...</label>
                <div class="mt-1">
                    <select id="role" name="role" onchange="toggleOrgField(this.value)" class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm bg-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors cursor-pointer">
                        <option value="CUSTOMER" {% if role == 'CUSTOMER' %}selected{% endif %}>Attend Events (Customer)</option>
                        <option value="ORGANIZER" {% if role == 'ORGANIZER' %}selected{% endif %}>Host & Manage Events (Organizer)</option>
                    </select>
                </div>
            </div>

            <div id="org_field_container" class="{% if role != 'ORGANIZER' %}hidden{% endif %}">
                <label for="organization_name" class="block text-sm font-medium text-gray-700">Organization / Company Name</label>
                <div class="mt-1">
                    <input id="organization_name" name="organization_name" type="text" value="{{ organization_name|default:'' }}" class="appearance-none block w-full px-3 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors" placeholder="e.g. Acme Events LLC">
                </div>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors cursor-pointer">
                    Create Account
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function toggleOrgField(val) {
    const orgContainer = document.getElementById('org_field_container');
    if (orgContainer) {
        if (val === 'ORGANIZER') {
            orgContainer.classList.remove('hidden');
        } else {
            orgContainer.classList.add('hidden');
        }
    }
}
</script>
{% endblock %}
